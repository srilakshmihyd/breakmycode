[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakmycode"
version = "0.2.0"
description = "Generate pytest tests, find flaky failures, and propose reviewed fixes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "openai>=1.0.0",
    "pytest>=7.0.0",
    "langgraph>=0.2,<1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
breakmycode = "breakmycode.cli:main"

[tool.setuptools.packages.find]
include = ["breakmycode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

